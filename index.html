:root{
  --bg:#000; --surface:#131313; --surface2:#1c1c1c; --line:#2b2b2b;
  --orange:#E87A2C; --orange-d:#c9631a; --text:#f3f3f3; --mute:#9b9b9b;
  --ok:#4cb37f; --bad:#e5533d; --warn:#e8a92c; --info:#5aa0e8;
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-d: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --orange-t:#E87A2C; --nav:#0a0a0a; --overlay:rgba(0,0,0,.65); --danger-line:#4a2620;
  color-scheme:dark;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f3f1; --surface:#ffffff; --surface2:#f0eeeb; --line:#dedbd6;
  --text:#1c1b1a; --mute:#6a6763;
  --orange-t:#B5500E;
  --ok:#1e8a57; --bad:#cc3b27; --warn:#a86a0a; --info:#2568b8;
  --nav:#ffffff; --overlay:rgba(20,18,16,.45); --danger-line:#efc2ba;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4}
h1,h2,h3,.disp{font-family:var(--font-d);font-weight:700;letter-spacing:.01em;margin:0}
button{font-family:var(--font);color:inherit;cursor:pointer}
input,textarea,select{font-family:var(--font);color:var(--text)}
#app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + var(--s4)) var(--s4) calc(104px + env(safe-area-inset-bottom,0px))}
body.editing #app{padding-bottom:calc(128px + env(safe-area-inset-bottom,0px))}

/* topo */
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top img{width:44px;height:44px;border-radius:10px;border:1px solid var(--line)}
.top h1{font-size:28px;flex:1;line-height:1.1}
.top .sub{color:var(--mute);font-size:13px}
.back{background:var(--surface2);border:1px solid var(--line);width:40px;height:40px;border-radius:12px;font-size:22px;line-height:1}
.inst{background:var(--surface2);border:1px solid var(--orange);color:var(--orange-t);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600}

/* cartões e campos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:var(--s4);margin-bottom:var(--s3)}
.card h3{font-size:19px;margin-bottom:var(--s3);color:var(--orange-t)}
.f{display:block;margin-bottom:var(--s3)}
.f>span{display:block;font-size:13px;color:var(--mute);margin-bottom:var(--s1)}
.f input,.f textarea,.f select,.search{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px;outline:none;font-family:var(--font)}
.f input:focus,.f textarea:focus,.f select:focus,.search:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(232,122,44,.2)}
.f textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.grid3{display:grid;grid-template-columns:1.3fr 1.3fr .7fr;gap:var(--s3)}
.search{margin-bottom:var(--s3)}

/* botões */
.btn{border:0;border-radius:12px;padding:var(--s3) var(--s4);font-weight:600;background:var(--orange);color:#111;min-height:48px}
.btn:active{background:var(--orange-d)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.line{background:transparent;border:1px solid var(--orange);color:var(--orange-t)}
.btn.danger{background:transparent;border:1px solid var(--danger-line);color:var(--bad)}
.btn.solid-danger{background:var(--bad);color:#fff}
.btn.solid-danger:active{background:#c8402c}
.btn.wa{background:#25D366;color:#06280f}
.btn.wa:active{background:#1fb958}
.btn.block{width:100%}
.linklike{background:none;border:0;color:var(--orange-t);text-decoration:underline;font:inherit;padding:0;cursor:pointer}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s3)}
.actions .wide{grid-column:1/-1}

/* chips */
.chips{display:flex;gap:var(--s2);margin-bottom:var(--s3);overflow-x:auto}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:var(--s2) var(--s4);white-space:nowrap;font-size:14px}
.chip.on{background:var(--orange);border-color:var(--orange);color:#111;font-weight:600}
.pill{font-size:12px;font-weight:600;padding:var(--s1) var(--s2);border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.warn{color:var(--warn)}.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}.pill.info{color:var(--info)}.pill.mute{color:var(--mute)}

/* lista de documentos */
.doc{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:var(--s4);margin-bottom:var(--s3)}
.doc .r1{display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
.doc .num{font-family:var(--font-d);font-weight:700;font-size:18px;color:var(--orange-t)}
.doc .cli{font-weight:600;margin-top:var(--s1)}
.doc .veh{color:var(--mute);font-size:14px}
.doc .r3{display:flex;justify-content:space-between;align-items:baseline;margin-top:var(--s2)}
.doc .tot{font-family:var(--font-d);font-weight:700;font-size:22px}
.doc .dt{color:var(--mute);font-size:13px}
.doc-child{width:calc(100% - var(--s5));margin-left:var(--s5);margin-top:calc(var(--s1) * -1);border-left:3px solid var(--orange);border-top-left-radius:4px;border-bottom-left-radius:4px}
.empty{text-align:center;color:var(--mute);padding:var(--s6) var(--s4);border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:var(--s1)}

/* itens do orçamento */
.it{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:var(--s3);margin-bottom:var(--s2)}
.it .nm{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:var(--s2) var(--s1);margin-bottom:var(--s2);outline:none;font-weight:600}
.it .nm:focus{border-color:var(--orange)}
.it .row2{display:flex;align-items:center;gap:var(--s2)}
.qty{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.qty button{background:none;border:0;width:40px;height:44px;font-size:20px}
.qty b{min-width:24px;text-align:center}
.it .val{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:var(--s3);outline:none;text-align:right}
.it .val:focus{border-color:var(--orange)}
.it .x{background:none;border:0;color:var(--bad);font-size:24px;width:40px;height:44px}
.it .sub{text-align:right;color:var(--mute);font-size:13px;margin-top:var(--s2)}

.lines .l{display:flex;justify-content:space-between;padding:var(--s2) 0;border-bottom:1px solid var(--line)}
.lines .l:last-child{border:0}
.lines .l span:first-child{color:var(--mute)}
.lines .t{font-size:24px;padding-top:var(--s3)}
.lines .t span:last-child{color:var(--orange-t);font-family:var(--font-d);font-weight:700;font-size:28px}

/* catálogo */
.grp{font-weight:700;font-size:17px;margin:var(--s5) 0 var(--s1)}
.sub-grp{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:var(--s3) 0 0}
.listbar{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);margin:0 0 var(--s2);font-size:13px;color:var(--mute)}
.linkbtn{background:none;border:0;color:var(--orange-t);font-weight:600;font-size:13px;padding:var(--s2) 0;white-space:nowrap}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:var(--s3);overflow:hidden}
.chead{display:flex;align-items:center;gap:var(--s2);padding-right:var(--s3)}
.ctoggle{flex:1;min-width:0;display:flex;align-items:center;gap:var(--s3);background:none;border:0;text-align:left;padding:var(--s4)}
.chev{width:18px;height:18px;flex-shrink:0;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.ccard.open .chev{transform:rotate(90deg)}
.ctext{min-width:0;display:flex;flex-direction:column;gap:var(--s1)}
.cname{font-weight:700;font-size:17px;line-height:1.2}
.cmeta{font-size:13px;color:var(--mute)}
.iconbtn{background:var(--surface2);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text)}
.cbody{border-top:1px solid var(--line);padding:0 var(--s4) var(--s2)}
.subHead{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);margin-top:var(--s3)}
.subHead span{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.slist{margin-top:var(--s1)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:var(--s3) 0;min-height:48px}
.slist .srow:last-child{border-bottom:0}
.srow .sname{min-width:0}
.srow .v{color:var(--orange-t);font-weight:600;white-space:nowrap}
.srow-empty{color:var(--mute);font-size:13px;padding:var(--s2) 0 var(--s1)}
.btn.sm{min-height:40px;padding:var(--s2) var(--s4)}.svc{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:var(--s3) var(--s4);margin-bottom:var(--s2);gap:var(--s3)}
.svc b{font-weight:600}
.svc .v{color:var(--orange-t);font-weight:600;white-space:nowrap}
.svc .n{background:var(--orange);color:#111;border-radius:999px;font-size:12px;font-weight:700;padding:2px var(--s2);margin-left:var(--s2)}
.subRow{display:flex;gap:var(--s2);align-items:center;margin-bottom:var(--s2)}
.subRow input{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:var(--s3);color:var(--text)}
.subRow .x{background:none;border:0;color:var(--bad);font-size:22px;width:40px;height:44px;flex-shrink:0}
.subAdd{display:flex;gap:var(--s2);margin-top:var(--s1)}
.subAdd input{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:var(--s3)}
.subAdd button{flex-shrink:0;padding:0 var(--s4)}
.colabRow{display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:var(--s3) var(--s4);margin-bottom:var(--s2)}
.colabRow button{background:none;border:0;color:var(--bad);font-size:22px;width:32px;height:32px;flex-shrink:0}

/* navegação inferior */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:var(--s2) var(--s2) calc(var(--s2) + env(safe-area-inset-bottom,0px));z-index:20}
body.editing nav{display:none}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:var(--s1);font-size:11.5px;color:var(--mute);padding:var(--s2) 0}
nav button.on{color:var(--orange-t)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* barra do editor */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--nav);border-top:1px solid var(--line);padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom,0px));z-index:20;display:none}
body.editing .bar{display:block}
.bar .in{max-width:640px;margin:0 auto}
.bar .sum{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--s2)}
.bar .sum span{color:var(--mute)}
.bar .sum b{font-family:var(--font-d);font-size:28px;color:var(--orange-t)}
.bar .two{display:grid;grid-template-columns:1fr 2fr;gap:var(--s3)}

.sheet-bg{position:fixed;inset:0;background:var(--overlay);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:86vh;overflow:auto;padding:var(--s3) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom,0px))}

.sheet h2{font-size:24px;margin-bottom:var(--s3)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:var(--s3) var(--s4);border-radius:12px;font-weight:600;z-index:60;max-width:88%;text-align:center}
.hint{color:var(--mute);font-size:13px;margin:var(--s2) 0 0}
.hint.flush{margin:0 0 var(--s3)}
.hint.blk{margin:var(--s1) 0 var(--s3)}
.hint.ln{margin:var(--s1) 0 0}
.hint.tuck{margin:calc(var(--s2) * -1) 0 var(--s3)}
.mb3{margin-bottom:var(--s3)}
.sp2{height:var(--s2)}
.sp3{height:var(--s3)}
.pre{white-space:pre-wrap;margin-top:var(--s2)}
#pl>.grp:first-child{margin-top:0}
.card h3.h3-sep{margin-top:var(--s4)}
.chips.wrap{margin:0;flex-wrap:wrap}
.actions.first{margin:0 0 var(--s3)}
.confirm-bg{position:fixed;inset:0;background:var(--overlay);z-index:70;display:flex;align-items:center;justify-content:center;padding:24px}
.confirm-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:var(--s5);max-width:360px;width:100%}
.confirm-box p{margin:0 0 var(--s4);font-size:15px;line-height:1.4;color:var(--text)}
.confirm-box .actions{margin-top:0}

/* impressão */
#print{display:none}
.pd{font-family:var(--font);color:#111;font-size:12px}
.pd header{display:flex;align-items:center;gap:var(--s4);background:#000;color:#fff;padding:var(--s3) var(--s4);border-bottom:5px solid #E87A2C}
.pd header img{width:74px;height:74px}
.pd header .co{flex:1}
.pd header h2{font-family:var(--font-d);font-size:20px;margin:0 0 4px}
.pd header p{margin:0;color:#ddd;font-size:11px}
.pd .pn{text-align:right}
.pd .pn b{display:block;font-family:var(--font-d);font-size:17px;color:#E87A2C}
.pd .pn span{display:block;font-size:12px}
.pd .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);margin:var(--s4) 0}
.pd .pgrid div{border:1px solid #ccc;border-radius:6px;padding:var(--s3)}
.pd h4{margin:0 0 var(--s2);font-size:11px;color:#E87A2C;text-transform:uppercase;font-family:var(--font)}
.pd p{margin:var(--s1) 0}
.pd table{width:100%;border-collapse:collapse;margin-bottom:var(--s3)}
.pd th{background:#000;color:#fff;text-align:left;padding:var(--s2);font-size:11px}
.pd td{padding:var(--s2);border-bottom:1px solid #ddd}
.pd .r{text-align:right}
.pd .c{text-align:center}
.pd .totals{margin-left:auto;width:250px}
.pd .totals div{display:flex;justify-content:space-between;padding:4px 0}
.pd .totals .g{border-top:2px solid #000;margin-top:4px;padding-top:8px;font-size:16px;font-weight:bold;font-family:var(--font-d)}
.pd .notes{margin:var(--s4) 0;border:1px solid #ccc;border-radius:6px;padding:var(--s3)}
.pd .sign{display:grid;grid-template-columns:1fr 1fr;gap:var(--s6);margin-top:64px}
.pd .sign div{border-top:1px solid #111;text-align:center;padding-top:var(--s2);font-size:11px}
.pd .foot{margin-top:var(--s4);text-align:center;color:#666;font-size:10px}
@media print{
  @page{size:A4;margin:10mm}
  html,body{background:#fff!important;color:#111}
  #app,nav,.bar,.toast,.sheet-bg,.confirm-bg{display:none!important}
  #print{display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function blankCliente(){return{nome:'',doc:'',fone:'',endereco:'',numero:'',bairro:'',cidade:'',estado:''}}
function load(){
  try{
    const r=JSON.parse(localStorage.getItem(KEY));
    if(r&&r.docs&&r.services&&r.categories){
      r.clients=r.clients||[];
      r.colaboradores=r.colaboradores||[];
      r.cfg=r.cfg||{};
      r.cfg.nextOrc=r.cfg.nextOrc||1;r.cfg.nextPedido=r.cfg.nextPedido||1;r.cfg.nextOs=r.cfg.nextOs||1;
      r.docs.forEach(d=>{
        d.cliente=Object.assign(blankCliente(),d.cliente||{});
        if(d.tipo!=='os'&&d.tipo!=='pedido')d.tipo='orcamento';
        d.dataEntrada=d.dataEntrada||'';
        d.dataSaida=d.dataSaida||d.previsao||'';
        delete d.previsao;
        d.colaborador=d.colaborador||'';
        d.origemId=d.origemId||null;
        d.clienteId=d.clienteId||null;
      });
      return r;
    }
  }catch(e){}
  return seed();
}

  return S.docs.length?`<div class="empty"><b>Nada encontrado</b>Tente outro nome ou placa.</div>`
    :`<div class="empty"><b>Nenhum orçamento ainda</b>Toque em <b style="display:inline;color:var(--orange-t)">Novo</b> para criar o primeiro.</div>`;
}
function listHtml(){
  const q=ui.q.trim().toLowerCase();
  const matches=d=>!q||[d.cliente.nome,d.veiculo.placa,d.veiculo.modelo,label(d)].join(' ').toLowerCase().includes(q);
  if(ui.f==='todos'){
    const topLevel=S.docs.filter(d=>matches(d)&&(d.tipo!=='os'||!d.origemId||!getDoc(d.origemId)))
      .sort((a,b)=>b.criado.localeCompare(a.criado));
    if(!topLevel.length)return emptyMsg();
    let html='';
    for(const d of topLevel){
      html+=docCard(d);
      if(d.tipo!=='os'){
        const rel=S.docs.filter(x=>x.origemId===d.id&&matches(x)).sort((a,b)=>b.criado.localeCompare(a.criado));
        for(const r of rel)html+=docCard(r,true);
      }
    }
    return html;
  }
  const l=S.docs.filter(d=>d.tipo===ui.f&&matches(d)).sort((a,b)=>b.criado.localeCompare(a.criado));
  if(!l.length)return emptyMsg();
  return l.map(d=>docCard(d)).join('');
}

/* ---------- catálogo (categorias, subcategorias e serviços, tudo editável) ---------- */
function vCat(){
  return `<div class="top"><div style="flex:1"><h1>Serviços</h1><div class="sub">Categorias, subcategorias e valores</div></div><button class="btn sm" data-act="catNew">+ Categoria</button></div>
  <input class="search" id="cq" placeholder="Buscar categoria, subcategoria ou serviço" value="${esc(ui.cq)}" autocomplete="off">
  <div id="cl">${catTree()}</div>`;
}
const plural=(n,s,p)=>n+' '+(n===1?s:p);
const ICON_PENCIL='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
function catTree(){
  const q=ui.cq.trim().toLowerCase();
  const hit=s=>!q||s.toLowerCase().includes(q);
  if(!S.categories.length)return `<div class="empty"><b>Nenhuma categoria</b>Toque em “+ Categoria” para começar.</div>`;
  const allOpen=S.categories.every(c=>ui.open[c.id]);
  let out=`<div class="listbar"><span>${plural(S.categories.length,'categoria','categorias')} · ${plural(S.services.length,'serviço','serviços')}</span>${q?'':`<button class="linkbtn" data-act="catToggleAll">${allOpen?'Recolher tudo':'Expandir tudo'}</button>`}</div>`;
  let shown=0;
  for(const c of S.categories){
    const nSvc=S.services.filter(s=>s.catId===c.id).length;
    let body='';
    for(const sb of c.subs){
      const items=S.services.filter(s=>s.catId===c.id&&s.subId===sb.id).filter(s=>!q||hit(c.nome)||hit(sb.nome)||hit(s.nome));
      if(q&&!hit(c.nome)&&!hit(sb.nome)&&!items.length)continue;
      body+=`<div class="subHead"><span>${esc(sb.nome)}</span><button class="linkbtn" data-act="svcNew" data-cat="${c.id}" data-sub="${sb.id}">+ Serviço</button></div>`;
      body+=items.length?`<div class="slist">${items.map(s=>`<button class="srow" data-act="svcEdit" data-id="${s.id}"><span class="sname">${esc(s.nome)}</span><span class="v">${brl(s.valor)}</span></button>`).join('')}</div>`
        :`<div class="srow-empty">Nenhum serviço aqui ainda.</div>`;
    }
    if(q&&!hit(c.nome)&&!body)continue;
    if(!c.subs.length)body=`<div class="srow-empty">Nenhuma subcategoria ainda.</div>`;
    body+=`<div class="subHead"><span></span><button class="linkbtn" data-act="catEdit" data-id="${c.id}">Editar subcategorias</button></div>`;
    const open=q?true:!!ui.open[c.id];
    shown++;
    out+=`<section class="ccard${open?' open':''}">
      <div class="chead">
        <button class="ctoggle" data-act="catToggle" data-id="${c.id}" aria-expanded="${open}">
          <svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          <span class="ctext"><span class="cname">${esc(c.nome)}</span><span class="cmeta">${plural(c.subs.length,'subcategoria','subcategorias')} · ${plural(nSvc,'serviço','serviços')}</span></span>
        </button>
        <button class="iconbtn" data-act="catEdit" data-id="${c.id}" aria-label="Editar categoria">${ICON_PENCIL}</button>
      </div>
      ${open?`<div class="cbody">${body}</div>`:''}
    </section>`;
  }
  return shown?out:`<div class="empty"><b>Nada encontrado</b>Tente outro termo.</div>`;
}
function catSheet(id){
  const c=id?getCat(id):null;
  sheet(`<h2>${id?'Editar categoria':'Nova categoria'}</h2>
    <label class="f"><span>Nome da categoria</span><input id="cn" value="${esc(c?c.nome:'')}" placeholder="Ex.: Bancos" autocomplete="off"></label>
    ${id?`<div class="f"><span>Subcategorias</span><div id="subList">${subRows(c)}</div>
      <div class="subAdd"><input id="newSub" placeholder="Nova subcategoria" autocomplete="off"><button class="btn line" data-act="subAddInline" data-cat="${id}">Adicionar</button></div></div>`
      :`<p class="hint flush">Depois de criar, você adiciona as subcategorias editando a categoria.</p>`}
    <div class="actions"><button class="btn wide" data-act="catSave" data-id="${id||''}">Salvar</button>
    ${id?`<button class="btn danger" data-act="catDel" data-id="${id}">Excluir categoria</button>`:''}
    <button class="btn ghost ${id?'':'wide'}" data-act="closeSheet">Cancelar</button></div>`);
}
function subRows(c){
  return c.subs.length?c.subs.map(sb=>`<div class="subRow"><input value="${esc(sb.nome)}" data-subrow="${sb.id}">
    <button class="x" data-act="subDelInline" data-cat="${c.id}" data-id="${sb.id}" aria-label="Excluir subcategoria">×</button></div>`).join('')

function subOptions(catId,selSub){

function svcSheet(id,presetCat,presetSub){
  const s=id?S.services.find(x=>x.id===id):null;
  const catId=s?s.catId:presetCat, subId=s?s.subId:presetSub;
  sheet(`<h2>${id?'Editar serviço':'Novo serviço'}</h2>
    <label class="f"><span>Categoria</span><select id="svCat">${S.categories.map(c=>`<option value="${c.id}" ${c.id===catId?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></label>
    <label class="f"><span>Subcategoria</span><select id="svSub">${subOptions(catId,subId)}</select></label>
    <label class="f"><span>Nome do serviço</span><input id="sn" value="${esc(s?s.nome:'')}" placeholder="Ex.: Jogo completo" autocomplete="off"></label>
    <label class="f"><span>Valor padrão (R$)</span><input id="sv" inputmode="decimal" value="${fmtIn(s?s.valor:'')}" placeholder="0,00"></label>
    <div class="actions"><button class="btn wide" data-act="svcSave" data-id="${id||''}">Salvar</button>
    ${id?`<button class="btn danger" data-act="svcDel" data-id="${id}">Excluir</button>`:''}<button class="btn ghost ${id?'':'wide'}" data-act="closeSheet">Cancelar</button></div>`);

  <header><img src="${LOGO}" alt=""><div class="co"><h2>${esc(EMPRESA)}</h2><p>${esc(ENDERECO)}</p>${FONE?`<p>Tel.: ${esc(FONE)}</p>`:''}</div>
    <div class="pn"><b>${tit}</b><span>Nº ${pad(d.tipo==='os'?d.osNum:d.tipo==='pedido'?d.pedNum:d.orcNum)}</span><span>${fmtDate(d.criado)}</span></div></header>
  <div class="pgrid"><div><h4>Cliente</h4><p><b>${esc(c.nome)}</b></p>${c.doc?`<p>CPF/CNPJ: ${esc(c.doc)}</p>`:''}${c.fone?`<p>${esc(c.fone)}</p>`:''}${endereco?`<p>${esc(endereco)}</p>`:''}${local?`<p>${esc(local)}</p>`:''}</div>
    <div><h4>Veículo</h4><p><b>${esc(v.modelo||'—')}</b>${v.ano?' · '+esc(v.ano):''}</p><p>${v.placa?'Placa: '+esc(v.placa):''}${v.cor?' · Cor: '+esc(v.cor):''}</p></div></div>
  <table><thead><tr><th>Serviço</th><th class="c">Qtd</th><th class="r">Valor un.</th><th class="r">Subtotal</th></tr></thead><tbody>
    ${d.itens.map(i=>`<tr><td>${esc(i.nome)}</td><td class="c">${i.qtd}</td><td class="r">${brl(i.valor)}</td><td class="r">${brl(i.qtd*i.valor)}</td></tr>`).join('')}</tbody></table>
  <div class="totals"><div><span>Subtotal</span><span>${brl(subtotal(d))}</span></div>
    ${d.desconto?`<div><span>Desconto</span><span>− ${brl(d.desconto)}</span></div>`:''}
    <div class="g"><span>Total</span><span>${brl(total(d))}</span></div></div>
  ${(d.pagamento||d.dataEntrada||d.dataSaida||d.colaborador||d.obs)?`<div class="notes">
    ${d.pagamento?`<p><b>Pagamento:</b> ${esc(d.pagamento)}</p>`:''}
    ${d.dataEntrada?`<p><b>Entrada:</b> ${fmtDate(d.dataEntrada)}</p>`:''}
    ${d.dataSaida?`<p><b>Saída:</b> ${fmtDate(d.dataSaida)}</p>`:''}
    ${d.colaborador?`<p><b>Colaborador:</b> ${esc(d.colaborador)}</p>`:''}
    ${d.obs?`<p style="white-space:pre-wrap"><b>Observações:</b> ${esc(d.obs)}</p>`:''}</div>`:''}
  <div class="sign"><div>Cliente</div><div>${esc(EMPRESA)}</div></div>
  <div class="foot">${d.tipo==='os'?'Ordem de serviço.':d.tipo==='orcamento'?'Válido por '+VALIDADE+' dias.':''}</div></div>`;
  setTimeout(()=>window.print(),80);
}
function waText(d){
  const v=d.veiculo,c=d.cliente;
  const endereco=[c.endereco,c.numero].filter(Boolean).join(', '), local=[c.bairro,c.cidade,c.estado].filter(Boolean).join(' · ');
  let t=`*${EMPRESA}*\n${label(d)} – ${fmtDate(d.criado)}\n\n`;
  t+=`*Cliente:*\n${c.nome}${c.fone?'\n'+c.fone:''}${endereco?'\n'+endereco:''}${local?'\n'+local:''}\n\n`;
  t+=`*Veículo:*\n${[v.modelo,v.ano,v.cor].filter(Boolean).join(' · ')||'Não informado'}${v.placa?'\nPlaca: '+v.placa:''}\n\n`;
  t+=`*Serviços:*\n`+d.itens.map(i=>`• ${i.qtd>1?i.qtd+'× ':''}${i.nome} – ${brl(i.qtd*i.valor)}`).join('\n');
  t+=`\nSubtotal: ${brl(subtotal(d))}`;
  if(d.desconto)t+=`\nDesconto: − ${brl(d.desconto)}`;
  t+=`\n*Total: ${brl(total(d))}*\n`;
  if(d.pagamento||d.dataEntrada||d.dataSaida||d.colaborador||d.obs){
    t+=`\n*Detalhes:*`;
    if(d.pagamento)t+=`\nPagamento: ${d.pagamento}`;
    if(d.dataEntrada)t+=`\nEntrada: ${fmtDate(d.dataEntrada)}`;
    if(d.dataSaida)t+=`\nSaída: ${fmtDate(d.dataSaida)}`;
    if(d.colaborador)t+=`\nColaborador: ${d.colaborador}`;
    if(d.obs)t+=`\nObs.: ${d.obs}`;
  }
  if(d.tipo==='orcamento')t+=`\n\nOrçamento válido por ${VALIDADE} dias.`;
  return t;
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){if(ui.view==='edit'){confirmDialog('Sair sem salvar as alterações deste documento?','Sair sem salvar',()=>go(g.dataset.go));return}go(g.dataset.go);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,i=b.dataset.i!==undefined?+b.dataset.i:null,d=ui.view==='doc'?getDoc(ui.id):null;
  switch(a){
    case 'new':if(ui.view==='edit')return;ui.draft=blank();go('edit');break;
    case 'open':go('doc',b.dataset.id);break;
    case 'filter':ui.f=b.dataset.f;render();break;
    case 'setTipo':{ui.draft.tipo=b.dataset.t;
      if(b.dataset.t==='orcamento'&&ui.draft.orcNum==null)ui.draft.orcNum=S.cfg.nextOrc++;
      if(b.dataset.t==='pedido'&&ui.draft.pedNum==null)ui.draft.pedNum=S.cfg.nextPedido++;
      render();break}
    case 'add':openPicker();break;
    case 'pick':{const s=S.services.find(x=>x.id===b.dataset.id);const ex=ui.draft.itens.find(x=>x.sid===s.id);
      if(ex)ex.qtd++;else ui.draft.itens.push({sid:s.id,nome:s.nome,qtd:1,valor:s.valor});
      renderItens();updTotal();pickList($('#ps').value);break}
    case 'custom':ui.draft.itens.push({sid:null,nome:'',qtd:1,valor:0});closeSheet();renderItens();updTotal();
      setTimeout(()=>{const n=document.querySelectorAll('.it .nm');n[n.length-1]?.focus()},50);break;
    case 'qplus':ui.draft.itens[i].qtd++;renderItens();updTotal();break;
    case 'qminus':if(ui.draft.itens[i].qtd>1){ui.draft.itens[i].qtd--;renderItens();updTotal()}break;
    case 'rm':ui.draft.itens.splice(i,1);renderItens();updTotal();break;
    case 'closeSheet':closeSheet();break;
    case 'save':saveDraft();break;
    case 'cancel':confirmDialog('Descartar as alterações feitas neste documento?','Descartar',()=>{const id=ui.draft.isNew?null:ui.draft.id;ui.draft=null;id?go('doc',id):go('home')});break;
    case 'edit':ui.draft=clone(d);go('edit');break;
    case 'status':
      if(d.tipo==='orcamento'&&b.dataset.s==='aprovado'){convertToPedido(d,true);render();break}
      d.status=b.dataset.s;save();render();break;
    case 'toPedido':confirmDialog('Transformar este orçamento em pedido?','Transformar',()=>{convertToPedido(d);render()},false);break;
    case 'toOS':confirmDialog('Gerar uma ordem de serviço a partir deste '+TIPO_LABEL[d.tipo]+'? Você poderá completar os dados antes de salvar.','Gerar OS',()=>{
        const n=clone(d);n.id=uid();n.isNew=true;n.tipo='os';n.status='aberta';
        n.orcNum=null;n.pedNum=null;n.osNum=null;n.origemId=d.id;n.criado=new Date().toISOString();
        n.colaborador='';n.dataEntrada=new Date().toISOString().slice(0,10);n.dataSaida='';
        ui.draft=n;go('edit')},false);break;
    case 'print':printDoc(d);break;
    case 'wa':{const f=(d.cliente.fone||'').replace(/\D/g,'');const p=f?(f.length<=11?'55'+f:f):'';window.open('https://wa.me/'+p+'?text='+encodeURIComponent(waText(d)),'_blank')}break;
    case 'dup':{const n=clone(d);n.id=uid();n.isNew=true;n.status=n.tipo==='os'?'aberta':'pendente';n.orcNum=null;n.pedNum=null;n.osNum=null;n.origemId=null;n.criado=new Date().toISOString();ui.draft=n;go('edit')}break;
    case 'del':confirmDialog('Excluir '+label(d)+'? Não dá para desfazer.','Excluir',()=>{S.docs=S.docs.filter(x=>x.id!==d.id);save();go('home')});break;
    case 'colabManage':colabSheet();break;
    case 'colabAdd':{const nome=$('#newColab').value.trim();if(!nome){toast('Digite o nome do colaborador');return}
      if(S.colaboradores.some(c=>c.nome.toLowerCase()===nome.toLowerCase())){toast('Esse colaborador já está na lista');return}
      S.colaboradores.push({id:uid(),nome});save();colabSheet();break}
    case 'colabDel':{const c=S.colaboradores.find(x=>x.id===b.dataset.id);
      confirmDialog(`Remover "${c.nome}" da lista de colaboradores?`,'Remover',()=>{S.colaboradores=S.colaboradores.filter(x=>x.id!==c.id);save();colabSheet()});break}
    case 'clientPick':clientPicker();break;
    case 'clientPickNew':pendingClientForDraft=true;clientSheet();break;
    case 'clientChoose':{const c=getClient(b.dataset.id);ui.draft.clienteId=c.id;
      ui.draft.cliente={nome:c.nome,doc:c.doc,fone:c.fone,endereco:c.endereco,numero:c.numero,bairro:c.bairro,cidade:c.cidade,estado:c.estado};
      closeSheet();render();toast('Dados do cliente preenchidos');break}
    case 'clientNew':clientSheet();break;
    case 'clientEdit':clientSheet(b.dataset.id);break;
    case 'clientSave':{const nome=$('#clNome').value.trim();if(!nome){toast('Informe o nome do cliente');return}
      const o={nome,doc:$('#clDoc').value.trim(),fone:$('#clFone').value.trim(),endereco:$('#clEnd').value.trim(),numero:$('#clNum').value.trim(),bairro:$('#clBairro').value.trim(),cidade:$('#clCidade').value.trim(),estado:$('#clEstado').value.trim().toUpperCase(),obs:$('#clObs').value.trim()};
      let client;
      if(b.dataset.id){client=getClient(b.dataset.id);Object.assign(client,o)}
      else{client={id:uid(),...o};S.clients.push(client)}
      save();closeSheet();
      if(pendingClientForDraft&&ui.draft){
        ui.draft.clienteId=client.id;
        ui.draft.cliente={nome:client.nome,doc:client.doc,fone:client.fone,endereco:client.endereco,numero:client.numero,bairro:client.bairro,cidade:client.cidade,estado:client.estado};
        pendingClientForDraft=false;toast('Cliente cadastrado e preenchido no documento');
      }
      render();break}
    case 'clientDel':{const c=getClient(b.dataset.id);
      confirmDialog(`Excluir o cliente "${c.nome}"? Isso não apaga orçamentos já feitos com ele.`,'Excluir cliente',()=>{S.clients=S.clients.filter(x=>x.id!==c.id);save();closeSheet();render()});break}
    case 'theme':setTheme(currentTheme()==='light'?'dark':'light');render();break;
    case 'catToggle':ui.open[b.dataset.id]=!ui.open[b.dataset.id];$('#cl').innerHTML=catTree();break;
    case 'catToggleAll':{const all=S.categories.every(c=>ui.open[c.id]);S.categories.forEach(c=>{ui.open[c.id]=!all});$('#cl').innerHTML=catTree();break}
    case 'catNew':catSheet();break;
    case 'catEdit':catSheet(b.dataset.id);break;
    case 'catSave':{const nome=$('#cn').value.trim();if(!nome){toast('Informe o nome da categoria');return}
      if(b.dataset.id){const c=getCat(b.dataset.id);c.nome=nome;
        document.querySelectorAll('[data-subrow]').forEach(inp=>{const sb=getSub(c.id,inp.dataset.subrow);const v=inp.value.trim();if(sb&&v)sb.nome=v});
      }else{const nc={id:uid(),nome,subs:[]};S.categories.push(nc);ui.open[nc.id]=true}
      save();closeSheet();render();break}
    case 'catDel':{const c=getCat(b.dataset.id);const n=S.services.filter(s=>s.catId===c.id).length;
      confirmDialog(`Excluir a categoria "${c.nome}" e tudo dentro dela (${c.subs.length} subcategoria(s) e ${n} serviço(s))? Não dá para desfazer.`,'Excluir categoria',()=>{
        S.services=S.services.filter(s=>s.catId!==c.id);S.categories=S.categories.filter(x=>x.id!==c.id);save();closeSheet();render()});break}
    case 'subAddInline':{const nome=$('#newSub').value.trim();if(!nome){toast('Digite o nome da subcategoria');return}
      getCat(b.dataset.cat).subs.push({id:uid(),nome});save();catSheet(b.dataset.cat);break}
    case 'subDelInline':{const c=getCat(b.dataset.cat),sb=getSub(c.id,b.dataset.id);const n=S.services.filter(s=>s.catId===c.id&&s.subId===sb.id).length;
      confirmDialog(`Excluir a subcategoria "${sb.nome}"${n?` e seus ${n} serviço(s)`:''}? Não dá para desfazer.`,'Excluir subcategoria',()=>{
        S.services=S.services.filter(s=>!(s.catId===c.id&&s.subId===sb.id));c.subs=c.subs.filter(x=>x.id!==sb.id);save();catSheet(c.id)});break}
    case 'svcNew':{const c=getCat(b.dataset.cat);
      if(!c.subs.length){toast('Crie uma subcategoria antes de adicionar um serviço');catSheet(c.id);return}
      svcSheet(null,c.id,b.dataset.sub);break}
    case 'svcEdit':svcSheet(b.dataset.id);break;
    case 'svcSave':{const nome=$('#sn').value.trim();if(!nome){toast('Informe o nome do serviço');return}
      const catId=$('#svCat').value,subId=$('#svSub').value;
      if(!subId){toast('Essa categoria ainda não tem subcategoria');return}
      const o={catId,subId,nome,valor:num($('#sv').value)};
      if(b.dataset.id)Object.assign(S.services.find(x=>x.id===b.dataset.id),o);else S.services.push({id:uid(),...o});
      ui.open[catId]=true;save();closeSheet();render();break}
    case 'svcDel':confirmDialog('Excluir este serviço da lista? Orçamentos já feitos não mudam.','Excluir',()=>{S.services=S.services.filter(x=>x.id!==b.dataset.id);save();closeSheet();render()});break;
    case 'install':if(deferred){deferred.prompt();deferred=null;render()}break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.k!==undefined){
    let v=t.value;if(t.dataset.k==='veiculo.placa'){v=v.toUpperCase();t.value=v}
    if(t.dataset.k==='cliente.fone'){v=maskPhone(v);t.value=v}
    if(t.dataset.k==='cliente.doc'){v=maskDoc(v);t.value=v}
    if(t.dataset.k==='cliente.estado'){v=v.toUpperCase();t.value=v}
    if(t.dataset.k==='desconto')v=num(v);
    setPath(ui.draft,t.dataset.k,v);updTotal();
  }else if(t.dataset.i!==undefined){
    const it=ui.draft.itens[+t.dataset.i];it[t.dataset.f]=t.dataset.f==='valor'?num(t.value):t.value;
    const s=$('#sub'+t.dataset.i);if(s)s.textContent=brl(it.qtd*it.valor);updTotal();
  }else if(t.id==='q'){ui.q=t.value;$('#list').innerHTML=listHtml()}
  else if(t.id==='cq'){ui.cq=t.value;$('#cl').innerHTML=catTree()}
  else if(t.id==='ps'){pickList(t.value)}
  else if(t.id==='clq'){clientPickList(t.value)}
  else if(t.id==='clsq'){ui.clq=t.value;$('#clsl').innerHTML=clientListHtml()}
  else if(t.id==='clFone'){t.value=maskPhone(t.value)}
  else if(t.id==='clDoc'){t.value=maskDoc(t.value)}
  else if(t.id==='clEstado'){t.value=t.value.toUpperCase()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='svCat')$('#svSub').innerHTML=subOptions(e.target.value,null);
});

/* ---------- PWA ---------- */
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(ui.view==='home')render()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

render();
</script>
</body>
</html>
